name: Build Stream Suite Update Center

on:
  workflow_dispatch:
  push:
    paths:
      - "UPDATER/src/**"
      - "UPDATER/tests/**"
      - "UPDATER/packaging/**"
      - "UPDATER/StreamSuiteUpdateCenter.spec"
      - "UPDATER/requirements-build.txt"
      - ".github/workflows/build-updater.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: UPDATER

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "UPDATER/requirements-build.txt"

      - name: Install build dependency
        run: python -m pip install --requirement requirements-build.txt

      - name: Run security and release tests
        run: python -m unittest discover -s tests -v

      - name: Validate production release catalog
        run: python src/stream_suite_updater.py --diagnostics --manifest deployment/release-catalog.json

      - name: Build portable Windows application
        run: python -m PyInstaller --noconfirm --clean StreamSuiteUpdateCenter.spec

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/StreamSuiteUpdateCenter.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  StreamSuiteUpdateCenter.exe" | Set-Content "dist/StreamSuiteUpdateCenter.exe.sha256"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Suite-Update-Center-Windows
          path: |
            UPDATER/dist/StreamSuiteUpdateCenter.exe
            UPDATER/dist/StreamSuiteUpdateCenter.exe.sha256
          if-no-files-found: error
          retention-days: 30
